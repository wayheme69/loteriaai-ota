name: Update Mega-Sena / Lotofácil results

on:
  schedule:
    # Tirages 21h (00:00 UTC) lun→ven et dim 11h (14:00 UTC), heure de Brasília. Passage toutes les 2 h.
    - cron: "50 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Results with real prizes (v3) — échec BRUYANT si Caixa et le miroir divergent
        run: python3 scripts/br_results.py
      - name: Commit if changed
        run: |
          git config user.name "results-bot"
          git config user.email "actions@github.com"
          git add br_results.json
          if ! git diff --cached --quiet; then
            git commit -m "results: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          else
            echo "No change."
          fi
